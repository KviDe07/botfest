services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: botfest
      POSTGRES_PASSWORD: botfest
      POSTGRES_DB: botfest
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botfest -d botfest"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://botfest:botfest@postgres:5432/botfest
    volumes:
      # Положите сюда schedule.jpg — кнопка «Расписание» в боте шлёт этот файл
      - ./backend/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python main.py"]
    restart: unless-stopped

  admin_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://botfest:botfest@postgres:5432/botfest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  admin_web:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin_web
    depends_on:
      - admin_api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
